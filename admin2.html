<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧞🧚 神燈精靈 管理中心</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">

                🧞🧚

            </div>

            <h2>

                神燈精靈

            </h2>

            <p>

                Management Center

            </p>

        </div>

        <nav>

            <ul class="menu">

                <li class="active" data-page="dashboard">

                    <span>🏠</span>

                    <span>Dashboard</span>

                </li>

                <li data-page="members">

                    <span>👥</span>

                    <span>會員管理</span>

                </li>

                <li data-page="tasks">

                    <span>📌</span>

                    <span>待辦事項</span>

                </li>

                <li data-page="notice">

                    <span>📢</span>

                    <span>公告管理</span>

                </li>

                <li data-page="events">

                    <span>📸</span>

                    <span>場次管理</span>

                </li>

                <li data-page="orders">

                    <span>📦</span>

                    <span>訂單管理</span>

                </li>

                <li data-page="deposit">

                    <span>💰</span>

                    <span>儲值金</span>

                </li>

                <li data-page="settings">

                    <span>⚙️</span>

                    <span>系統設定</span>

                </li>

            </ul>

        </nav>

        <div class="admin-profile">

            <div class="avatar">

                🧚

            </div>

            <div>

                <strong>

                    精靈

                </strong>

                <p>

                    Administrator

                </p>

            </div>

        </div>

    </aside>

    <!-- Main -->

    <main class="main">

        <header class="topbar">

            <div>

                <h1>

                    🧞🧚 神燈精靈

                </h1>

                <p>

                    歡迎回來，精靈 ✨

                </p>

            </div>

            <div class="topbar-right">

                <button class="top-btn">

                    🔔

                </button>

                <button class="top-btn">

                    ⚙️

                </button>

            </div>

        </header>

        <!-- Dashboard -->

        <section class="dashboard">

            <div class="stat-card">

                <div class="icon">

                    👥

                </div>

                <div>

                    <small>

                        會員總數

                    </small>

                    <h2 id="memberCount">

                        0

                    </h2>

                </div>

            </div>

            <div class="stat-card">

                <div class="icon">

                    🟡

                </div>

                <div>

                    <small>

                        待審核

                    </small>

                    <h2 id="pendingCount">

                        0

                    </h2>

                </div>

            </div>

            <div class="stat-card">

                <div class="icon">

                    🟢

                </div>

                <div>

                    <small>

                        LINE加入

                    </small>

                    <h2 id="lineCount">

                        0

                    </h2>

                </div>

            </div>

            <div class="stat-card">

                <div class="icon">

                    📅

                </div>

                <div>

                    <small>

                        今日新增

                    </small>

                    <h2 id="todayCount">

                        0

                    </h2>

                </div>

            </div>

        </section>

                <!-- Workspace -->

        <section class="workspace">

            <!-- 左側：會員 -->

            <div class="member-panel">

                <div class="panel-header">

                    <h2>👥 會員管理</h2>

                    <button id="addMember">

                        ＋ 新增

                    </button>

                </div>

                <div class="search-box">

                    <input
                        id="memberSearch"
                        type="text"
                        placeholder="🔍 搜尋 MQ、暱稱、IG、Threads">

                </div>

                <div class="member-list">

                    <!-- JS產生 -->

                </div>

            </div>

            <!-- 中間：會員資料 -->

            <div class="profile-panel">

                <div class="panel-header">

                    <div>

                        <h2>

                            👤 會員資料

                        </h2>

                        <p id="memberTitle">

                            尚未選擇會員

                        </p>

                    </div>

                    <div>

                        <span
                            id="memberStatus"
                            class="status">

                            -

                        </span>

                    </div>

                </div>

                <div
                    class="profile-card"
                    id="profileCard">

                    <div class="empty">

                        👈 請從左側選擇會員

                    </div>

                </div>

                <div class="profile-actions">

                    <button
                        id="editMember">

                        ✏ 編輯

                    </button>

                    <button
                        id="saveMember">

                        💾 儲存

                    </button>

                </div>

            </div>

            <!-- 右側 -->

            <div class="side-panel">

                <!-- 今日待辦 -->

                <div class="side-card">

                    <div class="panel-header">

                        <h2>

                            📌 今日待辦

                        </h2>

                        <button id="addTask">

                            ＋

                        </button>

                    </div>

                    <div class="task-list">

                        <!-- JS -->

                    </div>

                </div>

                <!-- 最近查看 -->

                <div class="side-card">

                    <div class="panel-header">

                        <h2>

                            🕒 最近查看

                        </h2>

                    </div>

                    <div
                        class="recent-list"
                        id="recentList">

                        尚無資料

                    </div>

                </div>

            </div>

        </section>

        <footer>

<script>

</body>

</html>
