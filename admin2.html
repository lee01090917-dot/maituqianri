<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        🧞🧚 神燈精靈 管理後台
    </title>

    <!-- CSS -->

    <link rel="stylesheet" href="admin2.css">

    <link rel="stylesheet" href="admin2-sidebar.css">

    <link rel="stylesheet" href="admin2-header.css">

    <link rel="stylesheet" href="admin2-dashboard.css">

    <link rel="stylesheet" href="admin2-member.css">

    <link rel="stylesheet" href="admin2-task.css">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">

                🧞🧚

            </div>

                        <h2>

                神燈精靈

            </h2>

            <p>

                Management Center

            </p>

        </div>

        <nav>

            <ul class="menu">

                <li class="active" data-page="dashboard">

                    <span>🏠</span>

                    <span>Dashboard</span>

                </li>

                <li data-page="members">

                    <span>👥</span>

                    <span>會員管理</span>

                </li>

                <li data-page="tasks">

                    <span>📌</span>

                    <span>待辦事項</span>

                </li>

                                <li data-page="notice">

                    <span>📢</span>

                    <span>公告管理</span>

                </li>

                <li data-page="events">

                    <span>📸</span>

                    <span>場次管理</span>

                </li>

                <li data-page="orders">

                    <span>📦</span>

                    <span>訂單管理</span>

                </li>

                <li data-page="deposit">

                    <span>💰</span>

                    <span>儲值金</span>

                </li>

                <li data-page="settings">

                    <span>⚙️</span>

                    <span>系統設定</span>

                </li>

            </ul>

        </nav>

                <div class="admin-profile">

            <div class="avatar">

                🧚

            </div>

            <div>

                <strong>

                    精靈

                </strong>

                <p>

                    Administrator

                </p>

            </div>

        </div>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header class="header">

            <div>

                <h1>

                    🧞🧚 神燈精靈

                </h1>

                <p>

                    歡迎回來，精靈 ✨

                </p>

            </div>

                        <div class="header-right">

                <button class="header-btn">

                    🔍

                </button>

                <button class="header-btn">

                    🔔

                </button>

                <button class="header-btn">

                    ⚙️

                </button>

            </div>

        </header>

        <!-- Dashboard -->

        <section class="dashboard">

            <div class="stat-card">

                <div class="icon">

                    👥

                </div>

                <div>

                    <small>

                        會員總數

                    </small>

                    <h2 id="memberCount">

                        0

                    </h2>

                </div>

            </div>

                        <div class="stat-card">

                <div class="icon">

                    🟡

                </div>

                <div>

                    <small>

                        待審核

                    </small>

                    <h2 id="pendingCount">

                        0

                    </h2>

                </div>

            </div>

            <div class="stat-card">

                <div class="icon">

                    🟢

                </div>

                <div>

                    <small>

                        LINE 加入

                    </small>

                    <h2 id="lineCount">

                        0

                    </h2>

                </div>

            </div>

            <div class="stat-card">

                <div class="icon">

                    📅

                </div>

                <div>

                    <small>

                        今日新增

                    </small>

                    <h2 id="todayCount">

                        0

                    </h2>

                </div>

            </div>

        </section>

                <!-- Workspace -->

        <section class="workspace">

            <!-- 左側：會員列表 -->

            <aside class="member-panel">

                <div class="panel-header">

                    <h2>

                        👥 會員管理

                    </h2>

                    <button
                        id="addMember">

                        ＋ 新增

                    </button>

                </div>

                <div class="search-box">

                    <input
                        id="memberSearch"
                        type="text"
                        placeholder="🔍 搜尋 MQ、暱稱、IG、Threads">

                </div>

                <div class="member-list">

                    <!-- JS 動態產生 -->

                </div>

            </aside>

                        <!-- 中間：會員資料 -->

            <section class="profile-panel">

                <div class="panel-header">

                    <div>

                        <h2>

                            👤 會員資料

                        </h2>

                        <p id="memberTitle">

                            尚未選擇會員

                        </p>

                    </div>

                    <span
                        id="memberStatus"
                        class="status">

                        -

                    </span>

                </div>

                <div
                    class="profile-card"
                    id="profileCard">

                    <div class="empty">

                        👈 請從左側選擇會員

                    </div>

                </div>

                <div class="profile-actions">

                    <button
                        id="editMember">

                        ✏ 編輯

                    </button>

                    <button
                        id="saveMember">

                        💾 儲存

                    </button>

                </div>

            </section>

                        <!-- 右側：資訊面板 -->

            <aside class="side-panel">

                <!-- 今日待辦 -->

                <div class="side-card">

                    <div class="panel-header">

                        <h2>

                            📌 今日待辦

                        </h2>

                        <button
                            id="addTask">

                            ＋

                        </button>

                    </div>

                    <div
                        class="task-list"
                        id="taskList">

                        <!-- JS 動態產生 -->

                    </div>

                </div>

                <!-- 最近查看 -->

                <div class="side-card">

                    <div class="panel-header">

                        <h2>

                            🕒 最近查看

                        </h2>

                    </div>

                    <div
                        class="recent-list"
                        id="recentList">

                        尚無資料

                    </div>

                </div>

            </aside>

        </section>

                <!-- 最近加入會員 -->

        <section class="recent-section">

            <div class="panel-header">

                <h2>

                    🆕 最近加入會員

                </h2>

                <button id="viewAllMembers">

                    查看全部

                </button>

            </div>

            <div
                class="recent-members"
                id="recentMembers">

                <!-- JS 動態產生 -->

            </div>

        </section>

        <!-- 快速操作 -->

        <section class="quick-actions">

            <button id="quickAddMember">

                👥 新增會員

            </button>

            <button id="quickAddTask">

                📌 新增待辦

            </button>

            <button id="quickAddNotice">

                📢 發布公告

            </button>

            <button id="quickCreateEvent">

                📸 新增場次

            </button>

        </section>

                <!-- Modal：新增 / 編輯會員 -->

        <div
            class="modal"
            id="memberModal">

            <div class="modal-content">

                <div class="modal-header">

                    <h2>

                        👤 會員資料

                    </h2>

                    <button
                        class="close-modal"
                        id="closeMemberModal">

                        ✕

                    </button>

                </div>

                <div class="modal-body">

                    <!-- 之後放表單 -->

                </div>

                <div class="modal-footer">

                    <button
                        class="btn-secondary">

                        取消

                    </button>

                    <button
                        class="btn-primary">

                        儲存

                    </button>

                </div>

            </div>

        </div>

                <!-- Modal：新增待辦 -->

        <div
            class="modal"
            id="taskModal">

            <div class="modal-content">

                <div class="modal-header">

                    <h2>

                        📌 新增待辦

                    </h2>

                    <button
                        class="close-modal"
                        id="closeTaskModal">

                        ✕

                    </button>

                </div>

                <div class="modal-body">

                    <!-- 之後放待辦表單 -->

                </div>

                <div class="modal-footer">

                    <button
                        class="btn-secondary">

                        取消

                    </button>

                    <button
                        class="btn-primary">

                        新增

                    </button>

                </div>

            </div>

        </div>

        <!-- Toast -->

        <div
            id="toast"
            class="toast">

        </div>

                <!-- Overlay -->

        <div
            class="modal-overlay"
            id="modalOverlay">

        </div>

    </main>

</div>

<!-- Firebase -->

<script
type="module"
src="./firebase.js">

</script>

<!-- Admin -->

<script
type="module"
src="./admin2.js">

</script>

    </body>

</html>
