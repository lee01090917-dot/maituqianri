<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>買圖千日 用在一時🙂‍↕️🙂‍↕️｜ATEEZ飯拍資料庫</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Hero -->

    <header class="hero">

        <h1>
            📸<br>
            買圖千日 用在一時🙂‍↕️🙂‍↕️
        </h1>

        <p>ATEEZ 飯拍資料庫</p>

    </header>

    <!-- 快速連結 -->

    <section class="section">

        <h2 class="section-title">
            🔗 快速連結
        </h2>

        <div class="links" id="link-list">

            <a class="link-btn">💬 官方LINE</a>

            <a class="link-btn">📒 對帳表</a>

            <a class="link-btn">📝 匯填表單</a>

            <a class="link-btn">💰 儲值金</a>

            <a class="link-btn">📖 注意事項</a>

        </div>

    </section>

    <!-- 公告 + 開拆 -->

    <div class="info-grid">

        <section class="section">

            <h2 class="section-title">
                📢 最新公告
            </h2>

            <div id="notice-list">

                <div class="card">

                    載入公告中...

                </div>

            </div>

        </section>

        <section class="section">

            <h2 class="section-title">
                🌟 現正開拆中
            </h2>

            <div id="current-list">

                <div class="card">

                    載入中...

                </div>

            </div>

        </section>

    </div>

    <!-- 飯拍資料庫 -->

    <section class="section">

        <h2 class="section-title">
            🔍 飯拍資料庫
        </h2>

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="搜尋場次、成員、ID..."
            >

        </div>

        <div class="category">

            <button
                class="active"
                data-category="">
                全部
            </button>

            <button
                data-category="簽售">
                簽售
            </button>

            <button
                data-category="舞台">
                舞台
            </button>

            <button
                data-category="出境">
                出境
            </button>

            <button
                data-category="時裝周">
                時裝周
            </button>

            <button
                data-category="OTHER">
                OTHER
            </button>

        </div>

        <div id="event-list">

            <div class="empty-state">

                <div class="icon">
                    🔍
                </div>

                <h3>
                    開始搜尋或選擇分類即可查看飯拍資料
                </h3>

                <p>
                    可搜尋：場次、成員、ID、分類
                </p>

            </div>

        </div>

    </section>

</div>

<!-- 之後功能 -->

<div id="favorite-float" style="display:none;"></div>

<div id="cart-float" style="display:none;"></div>

<footer>

    © 買圖千日 用在一時🙂‍↕️🙂‍↕️

</footer>

<script src="script.js"></script>

</body>

</html>
