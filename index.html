<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>買圖千日 用在一時</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#0b0d12;
color:white;
padding:20px;
padding-bottom:120px;
}

.container{
max-width:760px;
margin:auto;
}

.hero{
text-align:center;
margin-top:20px;
}

.hero h1{
font-size:32px;
margin-bottom:10px;
}

.hero p{
color:#9ca5b7;
line-height:1.6;
}

.card{
background:#151923;
border-radius:24px;
padding:20px;
margin-top:20px;
}

.title{
font-size:22px;
margin-bottom:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.item{
background:#1b2130;
border-radius:18px;
padding:18px 10px;
text-align:center;
text-decoration:none;
color:white;
transition:.2s;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
min-height:90px;
}

.item:hover{
transform:translateY(-2px);
background:#232b3d;
}

.item div{
font-size:28px;
margin-bottom:8px;
}

.notice{
background:#10141d;
padding:15px;
border-radius:18px;
margin-top:12px;
}

.notice small{
color:#8f98aa;
}

.notice p{
margin-top:8px;
color:#d5dbe7;
}

.row{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,.06);
}

.row:last-child{
border-bottom:none;
}

.bottom{
position:fixed;
bottom:12px;
left:50%;
transform:translateX(-50%);
background:#151923;
padding:14px 20px;
border-radius:24px;
display:flex;
gap:28px;
font-size:14px;
}

#calendar{
margin-top:12px;
min-height:650px;
}

.fc{
color:white;
}

.fc-toolbar-title{
font-size:20px !important;
}

.fc-button{
background:#232b3d !important;
border:none !important;
}

.fc-daygrid-day{
background:#10141d;
}

.fc-col-header-cell{
background:#1b2130;
padding:10px 0;
}

@media(max-width:600px){

.grid{
grid-template-columns:repeat(3,1fr);
}

.hero h1{
font-size:28px;
}

.fc-toolbar{
flex-direction:column;
gap:10px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>✦ 買圖千日 用在一時</h1>

<p>
飯拍 / 對帳 / 拆況 / 場次整合站<br>
請先查看網站資訊後再私訊😼
</p>

</div>

<div class="card">

<div class="title">
最新公告
</div>

<div id="notice-list">

<div class="notice">
讀取公告中...
</div>

</div>

</div>

<div class="card">

<div class="title">
快速入口
</div>

<div class="grid">

<a href="https://docs.google.com/spreadsheets/d/1B2WEQzu8f5eKHkzKWSjFSjPJqdxNWnuRIC_qHYzLyvY/edit?usp=sharing" target="_blank" class="item">
<div>📋</div>
對帳表
</a>

<a href="https://forms.gle/efSGpwbdTSVc5EkC8" target="_blank" class="item">
<div>💸</div>
匯填表單
</a>

<a href="https://docs.google.com/forms/d/e/1FAIpQLSeyGXxSSrkfXMuiUTkQ5n17MWHOe7zuQ8AmB9nTS8a8XrD3Ig/viewform" target="_blank" class="item">
<div>🪙</div>
儲值金
</a>

<a href="https://docs.google.com/spreadsheets/d/1FdYNbdjcAek8M7jpjW5s8r6ZWlGQ5xv100ORLhkqIL0/edit?usp=sharing" target="_blank" class="item">
<div>⚠️</div>
注意事項
</a>

<a href="https://lin.ee/SRkhRD9" target="_blank" class="item">
<div>💬</div>
官方LINE
</a>

<a href="https://line.me/ti/g2/sOFcLDonLh0FCVs0JtjoHeQcQGN2hRHXJGWljQ?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" class="item">
<div>👥</div>
社群
</a>

</div>

</div>

<div class="card">

<div class="title">
場次日曆
</div>

<div id="calendar"></div>

</div>

<div class="card">

<div class="title">
拆況統計
</div>

<div id="split-list">

<div class="notice">
讀取拆況中...
</div>

</div>

</div>

<div class="card">

<div class="title">
我的待付款
</div>

<div class="row">
<span>🔴 弘中生日場</span>
<span>NT$400</span>
</div>

<div class="row">
<span>🔴 WORLD TOUR</span>
<span>NT$1320</span>
</div>

<div class="row">
<b>目前需匯</b>
<b>NT$1720</b>
</div>

</div>

</div>

<div class="bottom">
🏠 首頁　📅 場次　💰 付款　⚙️ 後台
</div>

<script>

window.addEventListener('DOMContentLoaded', () => {
  loadData();
});

let calendarEvents = [];
let calendar;

async function loadData() {

  try {

    const noticeList = document.getElementById("notice-list");
    const splitList = document.getElementById("split-list");

    const response = await fetch(
      "把你的AppsScript exec網址貼這裡"
    );

    const data = await response.json();

    // 公告
    const notices = data.notices || [];

    noticeList.innerHTML = "";

    for(let i=1; i<notices.length; i++){

      const row = notices[i];

      noticeList.innerHTML += `
        <div class="notice">
          <b>${row[0] || ''}</b><br>
          <small>${row[1] || ''}</small>
          <p>${row[2] || ''}</p>
        </div>
      `;

    }

    // 日曆
    calendarEvents = [];

    const calendarData = data.calendar || [];

    for(let i=1; i<calendarData.length; i++){

      const row = calendarData[i];

      const rawDate = row[0].toString();

      const date =
        rawDate.substring(0,4) + '-' +
        rawDate.substring(4,6) + '-' +
        rawDate.substring(6,8);

      const type = row[1];
      const title = row[2];

      let color = '#ca8cff';

      if(type === '簽售') color = '#ff7a7a';
      if(type === '出境') color = '#7dff9b';
      if(type === '舞台') color = '#79a9ff';
      if(type === '時裝周') color = '#ffd96e';

      calendarEvents.push({
        title:title,
        start:date,
        color:color
      });

    }

    renderCalendar();

    // 拆況
    const splitData = [
      ["WORLD TOUR","弘中","20","18","2","尚未成團"],
      ["WORLD TOUR","星化","15","15","0","已成團 可先候補"]
    ];

    splitList.innerHTML = "";

    for(let i=0; i<splitData.length; i++){

      const row = splitData[i];

      const event = row[0];
      const member = row[1];
      const target = row[2];
      const current = row[3];
      const remain = row[4];
      const status = row[5];

      let statusColor = '#ff7a7a';

      if(status === '已成團 可先候補'){
        statusColor = '#7dff9b';
      }

      let statusText = `還差${remain}包成團`;

      if(status === '已成團 可先候補'){
        statusText = '已成團 可先候補';
      }

      splitList.innerHTML += `
        <div class="notice">

          <b>${event}</b>

          <p style="margin-top:10px;">
            ${member}
          </p>

          <p>
            目前拆況 ${current} / ${target}包
          </p>

          <p style="color:${statusColor};font-weight:bold;">
            ${statusText}
          </p>

        </div>
      `;

    }

  } catch(error) {

    console.error(error);

    document.body.innerHTML = `
      <div style="padding:40px;color:white;font-family:sans-serif;">
        網站資料讀取失敗 😭<br><br>
        ${error}
      </div>
    `;

  }

}

function renderCalendar(){

  const calendarEl = document.getElementById('calendar');

  if(calendar){
    calendar.destroy();
  }

  calendar = new FullCalendar.Calendar(calendarEl, {

    initialView:'dayGridMonth',

    height:'auto',

    headerToolbar:{
      left:'prev,next today',
      center:'title',
      right:''
    },

    events:calendarEvents

  });

  calendar.render();

}

</script>

</body>

</html>
