<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>買圖千日 用在一時🙂‍↕️🙂‍↕️｜ATEEZ飯拍資訊站</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Hero -->

    <header class="hero">

        <h1>
            📸<br>
            買圖千日 用在一時🙂‍↕️🙂‍↕️
        </h1>

        <p>ATEEZ 飯拍資訊站</p>

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="搜尋場次、成員、分類..."
            >

        </div>

        <div class="category">

            <button type="button" class="active" data-category="ALL">
                全部
            </button>

            <button type="button" data-category="簽售">
                簽售
            </button>

            <button type="button" data-category="舞台">
                舞台
            </button>

            <button type="button" data-category="出境">
                出境
            </button>

            <button type="button" data-category="時裝周">
                時裝周
            </button>

            <button type="button" data-category="OTHER">
                OTHER
            </button>

        </div>

    </header>

    <!-- 最新公告 -->

    <section class="section">

        <h2 class="section-title">
            📢 最新公告
        </h2>

        <div id="notice-list">

            <div class="card">
                載入公告中...
            </div>

        </div>

    </section>

    <!-- 現正開拆中 -->

    <section class="section">

        <h2 class="section-title">
            🌟 現正開拆中
        </h2>

        <div id="current-list">

            <div class="card">
                載入中...
            </div>

        </div>

    </section>

    <!-- 飯拍資料庫 -->

    <section class="section">

        <h2 class="section-title">
            🔍 飯拍資料庫
        </h2>

        <p class="section-desc">
            快速查詢本團曾開放的飯拍場次、成員與活動。
        </p>

        <div id="event-list">

            <div class="card">
                載入活動中...
            </div>

        </div>

    </section>

    <!-- 快速連結 -->

    <section class="section">

        <h2 class="section-title">
            🔗 快速連結
        </h2>

        <div class="links" id="link-list">

            <a class="link-btn">
                官方LINE
            </a>

            <a class="link-btn">
                飯拍注意事項
            </a>

            <a class="link-btn">
                對帳表
            </a>

            <a class="link-btn">
                匯填表單
            </a>

            <a class="link-btn">
                儲值金表單
            </a>

        </div>

    </section>

</div>

<!-- ❤️ 收藏（V3） -->
<div id="favorite-float" style="display:none;"></div>

<!-- 🛒 我的清單（V3） -->
<div id="cart-float" style="display:none;"></div>

<footer>

    © 買圖千日 用在一時🙂‍↕️🙂‍↕️

</footer>

<script src="script.js"></script>

</body>

</html>
