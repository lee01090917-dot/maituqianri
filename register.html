<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一次登入</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>歡迎加入 🎉</h1>

        <p class="subtitle">
            第一次登入，請先完成會員資料。
        </p>

        <input
            id="nickname"
            type="text"
            placeholder="社群暱稱">

        <br><br>

        <select id="platform">

            <option value="">請選擇社群平台</option>

            <option>Instagram</option>

            <option>Threads</option>

            <option>Facebook</option>

        </select>

        <br><br>

        <input
            id="account"
            type="text"
            placeholder="社群帳號">

        <br><br>

        <button id="save">
            送出申請
        </button>

    </div>

</div>

<script type="module" src="register.js"></script>

</body>
</html>
